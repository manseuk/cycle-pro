name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -d supabase/migrations ] && find supabase/migrations -maxdepth 1 -name '*.sql' -print -quit | grep -q .; then
            if [ -z "$SUPABASE_DB_URL" ]; then
              echo "Set the SUPABASE_DB_URL secret before deploying database migrations."
              exit 1
            fi
            pnpm exec supabase db push --db-url "$SUPABASE_DB_URL" --yes
          else
            echo "No Supabase migrations to apply."
          fi
      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ] || [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Set API_BASE_URL, SUPABASE_URL, and SUPABASE_ANON_KEY repository variables before deploying."
            exit 1
          fi
          pnpm --filter @cycle-pro/web build
      - name: Deploy frontend and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          for setting in SUPABASE_URL SUPABASE_ANON_KEY FRONTEND_ORIGIN SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!setting}" ]; then
              echo "Set the $setting repository variable before deploying the Worker."
              exit 1
            fi
          done
          pnpm --filter @cycle-pro/web exec wrangler pages deploy dist --project-name cycle-pro --branch main
          pnpm --filter @cycle-pro/api exec wrangler deploy \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "SUPABASE_ANON_KEY:$SUPABASE_ANON_KEY" \
            --var "FRONTEND_ORIGIN:$FRONTEND_ORIGIN"
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | pnpm --filter @cycle-pro/api exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY
