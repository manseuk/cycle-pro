# Needs Secret "cycle-pro-api-env" (key: .dev.vars) created by hand; see deploy/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: cycle-pro-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          volumeMounts:
            - name: env
              mountPath: /repo/apps/api/.dev.vars
              subPath: .dev.vars
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8787 }
            initialDelaySeconds: 5
          resources:
            limits: { memory: 512Mi }
      volumes:
        - name: env
          secret:
            secretName: cycle-pro-api-env
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8787
